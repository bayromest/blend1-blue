name: Bug
description: Something doesn't work
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got. Screenshots help.
    validations:
      required: true
  - type: input
    attributes:
      label: Blender version
      placeholder: 5.2.3, Steam
    validations:
      required: true
  - type: input
    attributes:
      label: Windows version
      placeholder: Windows 11
